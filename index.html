<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Lab: Plate Tectonics</title>
<style>
:root{
  --bg:#0b1726; --panel:#12243a; --panel2:#183150; --line:#2a4a6e;
  --ink:#e8f1fb; --dim:#9fb6cf; --amber:#ffb703; --teal:#2ec4b6; --red:#ef476f;
  --green:#06d6a0; --blue:#4cc9f0; --purple:#b388ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1d3b63 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3a1d4f 0%,transparent 60%),var(--bg);}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(11,23,38,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo .globe{width:34px;height:34px;border-radius:50%;background:conic-gradient(#ef476f 0 25%,#ffb703 0 50%,#2ec4b6 0 75%,#4cc9f0 0);animation:spin 8s linear infinite;box-shadow:0 0 14px #4cc9f088}
@keyframes spin{to{transform:rotate(360deg)}}
.logo small{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:1px}
.rank{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.xpbar{width:160px;height:10px;background:#0a1320;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));width:0;transition:width .6s}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:700}
.hbtn:hover{border-color:var(--amber)}
nav.tabs{display:flex;gap:6px;padding:0 16px 10px;max-width:1200px;margin:0 auto;overflow-x:auto}
.tab{flex:1;min-width:150px;background:var(--panel);border:2px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:12px;text-align:left;transition:.2s}
.tab b{font-size:18px;color:var(--amber);margin-right:6px}
.tab span{font-size:13px;font-weight:700}
.tab .pbar{height:4px;background:#0a1320;border-radius:3px;margin-top:6px;overflow:hidden}
.tab .pbar i{display:block;height:100%;background:var(--green);width:0;transition:width .5s}
.tab:hover{transform:translateY(-2px)}
.tab.on{border-color:var(--amber);background:linear-gradient(180deg,#22406a,#152c48);box-shadow:0 4px 18px #ffb70333}
main{max-width:1200px;margin:0 auto;padding:16px}
.brief{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(135deg,#1a3354,#122540);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.brief .avatar{font-size:44px;line-height:1}
.brief h2{margin:0 0 4px;font-size:22px}
.brief p{margin:4px 0;color:var(--dim);line-height:1.45}
.brief .log{font-family:"Courier New",monospace;color:var(--teal);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.18s;min-height:140px}
.card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 8px 24px #0006}
.card .ic{font-size:34px}
.card h3{margin:6px 0 4px;font-size:16px}
.card p{margin:0;color:var(--dim);font-size:13px;line-height:1.4}
.card .st{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:#0a1320;color:var(--dim);border:1px solid var(--line)}
.card.done{border-color:var(--green)}
.card.done .st{background:var(--green);color:#05261d;border-color:var(--green)}
.card.exam{background:linear-gradient(135deg,#3b2a0a,#1d1a12);border-color:#7a5a12}
.card.game{background:linear-gradient(135deg,#2b1745,#171a33);border-color:#5a3f8a}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stagehead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stagehead h2{margin:0;font-size:20px}
.back{background:#0a1320;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:700}
.back:hover{border-color:var(--amber)}
.goal{background:#0a1320;border-left:4px solid var(--amber);padding:10px 12px;border-radius:8px;color:var(--dim);font-size:14px;line-height:1.45;margin-bottom:12px}
.goal b{color:var(--amber)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
canvas,svg.sim{width:100%;height:auto;display:block;background:#07101b;border-radius:12px;border:1px solid var(--line);touch-action:none}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.btn{background:var(--panel2);border:2px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--teal)}
.btn.on{border-color:var(--amber);background:#3a2e0b;color:var(--amber)}
.btn.go{background:var(--teal);color:#062421;border-color:var(--teal)}
.btn.go:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.readout{background:#06101a;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;min-height:110px}
.readout h4{margin:0 0 6px;color:var(--amber);font-size:16px}
.readout .mono{font-family:"Courier New",monospace;color:var(--teal);font-size:12px}
.chip{display:inline-block;background:var(--panel2);border:2px solid var(--line);color:var(--ink);padding:7px 11px;border-radius:20px;margin:3px;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.chip.sel{border-color:var(--amber);background:#3a2e0b;color:var(--amber);transform:scale(1.05)}
.chip.ok{border-color:var(--green);background:#0b3b2e;color:var(--green);cursor:default}
.chip.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.check{margin-top:12px;background:#0d1d30;border:1px dashed var(--teal);border-radius:12px;padding:12px}
.check h4{margin:0 0 8px;color:var(--teal)}
.q{margin:10px 0}
.q .qt{font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:#0a1626;border:2px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:10px;margin:5px 0;font-size:14px}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green);background:#0b3b2e}
.opt.wrong{border-color:var(--red);background:#3b0f1c}
.explain{font-size:13px;color:var(--dim);margin-top:4px;padding:8px 10px;background:#0a1320;border-radius:8px}
.toastbox{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#13263b;border:2px solid var(--amber);padding:10px 14px;border-radius:12px;box-shadow:0 6px 20px #000a;font-weight:700;animation:pop .35s;max-width:320px}
@keyframes pop{from{transform:translateY(20px);opacity:0}}
.big{font-size:28px;font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:800;background:#0a1320;border:1px solid var(--line)}
.bins{display:flex;gap:10px;flex-wrap:wrap}
.bin{flex:1;min-width:200px;min-height:120px;border:2px dashed var(--line);border-radius:12px;padding:10px;background:#091523;cursor:pointer}
.bin:hover{border-color:var(--amber)}
.bin h4{margin:0 0 6px}
.matchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mcard{min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);padding:10px;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.15s;font-weight:700}
.mcard.term{background:#20365a;font-size:15px;color:var(--amber)}
.mcard.sel{border-color:var(--amber);transform:scale(1.04)}
.mcard.gone{visibility:hidden}
.mcard.bad{animation:shake .4s;border-color:var(--red)}
.journal .entry{background:#0a1626;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.journal .entry b{color:var(--amber)}
.locked{opacity:.4}
.legend{font-size:12px;color:var(--dim);margin-top:6px}
.slider{width:100%;accent-color:var(--amber)}
.hint{font-size:12px;color:var(--dim)}
.timer{font-size:22px;font-weight:800;color:var(--amber)}
.flash-g{animation:fg .5s}@keyframes fg{0%{box-shadow:0 0 0 0 #06d6a0}100%{box-shadow:0 0 0 18px #06d6a000}}
@media (max-width:640px){.tab{min-width:120px}.logo{font-size:16px}.xpbar{width:90px}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo"><div class="globe"></div><div>TERRA LAB<small>PLATE TECTONICS DISCOVERY SIMULATOR</small></div></div>
    <div class="rank"><span id="rankName">Lab Intern</span><div class="xpbar"><i id="xpFill"></i></div><span id="xpTxt">0 XP</span></div>
    <button class="hbtn" id="btnJournal">📓 Field Journal</button>
    <button class="hbtn" id="btnExam">🏆 Unit Test</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toastbox" id="toasts"></div>
<script>
/* ================= CORE ENGINE ================= */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const KEY = 'terraLab_v1';
let S = { xp: 0, done: {}, best: {}, found: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const RANKS = [[0, 'Lab Intern 🧪'], [150, 'Field Assistant 🎒'], [400, 'Junior Geologist 🪨'], [800, 'Seismologist 📈'], [1300, 'Senior Scientist 🔬'], [2000, 'Plate Tectonics Legend 🌋']];
function rankInfo() { let i = 0; while (i + 1 < RANKS.length && S.xp >= RANKS[i + 1][0]) i++; const lo = RANKS[i][0], hi = RANKS[i + 1] ? RANKS[i + 1][0] : lo + 1000; return { name: RANKS[i][1], pct: clamp((S.xp - lo) / (hi - lo), 0, 1), idx: i }; }
function drawHUD() { const r = rankInfo(); $('#rankName').textContent = r.name; $('#xpFill').style.width = (r.pct * 100) + '%'; $('#xpTxt').textContent = S.xp + ' XP'; drawTabs(); }
function addXP(n, why) { const before = rankInfo().idx; S.xp += n; save(); if (why) toast(`+${n} XP · ${why}`); const after = rankInfo().idx; if (after > before) setTimeout(() => toast(`🎖️ PROMOTED! You are now: ${rankInfo().name}`, 4500), 600); drawHUD(); }
function toast(msg, ms = 2600) { const t = el('div', { class: 'toast' }, msg); $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms); }
function complete(id, xp, name) { if (S.done[id]) { toast('✅ Mission replayed — nice practice!'); return; } S.done[id] = true; save(); addXP(xp, 'Mission complete: ' + name); }
function discover(term) { if (!S.found[term]) { S.found[term] = true; save(); toast('📓 New journal entry: ' + term); } }

/* --- animation & canvas helpers --- */
let cleanups = [];
function onLeave(fn) { cleanups.push(fn); }
function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function loop(fn) { let on = true, last = performance.now(); const f = now => { if (!on) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; fn(dt, now / 1000); requestAnimationFrame(f); }; requestAnimationFrame(f); const stop = () => on = false; onLeave(stop); return stop; }
function mkCanvas(parent, w, h) { const cv = el('canvas'); cv.width = w; cv.height = h; parent.appendChild(cv); const ctx = cv.getContext('2d'); const pos = e => { const r = cv.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: (p.clientX - r.left) * w / r.width, y: (p.clientY - r.top) * h / r.height }; }; return { cv, ctx, pos, w, h }; }
function txt(ctx, s, x, y, o = {}) { ctx.save(); ctx.font = `${o.b === false ? '' : 'bold '}${o.size || 14}px Trebuchet MS, sans-serif`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle'; if (o.stroke) { ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); } ctx.fillStyle = o.c || '#fff'; ctx.fillText(s, x, y); ctx.restore(); }
function poly(ctx, pts, fill, stroke, lw = 2) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }

/* --- Discovery checkpoint: questions inside a mission --- */
function checkpoint(parent, title, qs, onDone) {
  const box = el('div', { class: 'check' }, `<h4>🔎 ${title}</h4>`); parent.appendChild(box);
  let solved = 0;
  qs.forEach(q => {
    const d = el('div', { class: 'q' }, `<div class="qt">${q.q}</div>`); box.appendChild(d);
    let done = false;
    const order = shuffle(q.a.map((t, i) => ({ t, i })));
    order.forEach(o => {
      const b = el('button', { class: 'opt' }, o.t); d.appendChild(b);
      b.onclick = () => {
        if (done) return;
        if (o.i === q.c) { b.classList.add('right'); done = true; solved++; if (q.e) d.appendChild(el('div', { class: 'explain' }, '✔ ' + q.e)); if (q.term) discover(q.term); if (solved === qs.length && onDone) onDone(); }
        else { b.classList.add('wrong'); b.classList.add('bad'); toast('🤔 Not quite — look at the simulation again!'); }
      };
    });
  });
  return box;
}
function lockedCheck(parent, title, msg) { const box = el('div', { class: 'check locked' }, `<h4>🔒 ${title}</h4><div class="hint">${msg}</div>`); parent.appendChild(box); return box; }

/* ================= SECTIONS & NAV ================= */
const SECTIONS = {}; // filled by section files
const ORDER = ['7.1', '7.2', '7.3', '7.4'];
let current = '7.1';

function sectionProgress(id) { const s = SECTIONS[id]; const ids = s.missions.map(m => m.id).concat(['exam_' + id]); const n = ids.filter(i => S.done[i]).length; return n / ids.length; }
function drawTabs() {
  const nav = $('#tabs'); nav.innerHTML = '';
  ORDER.forEach(id => { const s = SECTIONS[id]; if (!s) return; const b = el('button', { class: 'tab' + (id === current ? ' on' : '') }, `<b>${id}</b><span>${s.title}</span><div class="pbar"><i style="width:${sectionProgress(id) * 100}%"></i></div>`); b.onclick = () => { current = id; showSection(id); }; nav.appendChild(b); });
}
function showSection(id) {
  runCleanups(); drawTabs();
  const s = SECTIONS[id]; const m = $('#main'); m.innerHTML = '';
  m.appendChild(el('div', { class: 'brief' }, `<div class="avatar">${s.avatar}</div><div><h2>${s.title}</h2><p class="log">${s.log}</p><p>${s.brief}</p></div>`));
  const g = el('div', { class: 'grid' }); m.appendChild(g);
  s.missions.forEach((mi, k) => {
    const c = el('div', { class: 'card' + (S.done[mi.id] ? ' done' : '') }, `<span class="st">${S.done[mi.id] ? '✔ DONE' : 'MISSION ' + (k + 1)}</span><div class="ic">${mi.icon}</div><h3>${mi.name}</h3><p>${mi.desc}</p>`);
    c.onclick = () => openMission(id, mi); g.appendChild(c);
  });
  const ex = el('div', { class: 'card exam' + (S.done['exam_' + id] ? ' done' : '') }, `<span class="st">${S.best[id] != null ? 'BEST ' + S.best[id] + '%' : 'EXAM'}</span><div class="ic">📝</div><h3>Field Exam ${id}</h3><p>10 random test-style questions. New mix every time. Score 80%+ to certify this section.</p>`);
  ex.onclick = () => openQuiz(id, s.quiz, 10, 'Field Exam ' + id); g.appendChild(ex);
  const mg = el('div', { class: 'card game' }, `<span class="st">${S.best['match_' + id] != null ? 'BEST ' + S.best['match_' + id] + 's' : 'GAME'}</span><div class="ic">🧩</div><h3>Specimen Match</h3><p>Race the clock: match every vocabulary term to its meaning.</p>`);
  mg.onclick = () => openMatch(id); g.appendChild(mg);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function stageShell(title, goal, backTo) {
  runCleanups(); const m = $('#main'); m.innerHTML = '';
  const st = el('div', { class: 'stage' }); m.appendChild(st);
  const hd = el('div', { class: 'stagehead' }); st.appendChild(hd);
  const b = el('button', { class: 'back' }, '← Back to base'); b.onclick = () => showSection(backTo || current); hd.appendChild(b);
  hd.appendChild(el('h2', {}, title));
  if (goal) st.appendChild(el('div', { class: 'goal' }, goal));
  const body = el('div'); st.appendChild(body);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  return body;
}
function openMission(sid, mi) { const body = stageShell(mi.icon + ' ' + mi.name, mi.goal, sid); mi.run(body, () => { complete(mi.id, mi.xp || 60, mi.name); }); }

/* ================= QUIZ ENGINE ================= */
function openQuiz(sid, bank, n, title) {
  const body = stageShell('📝 ' + title, 'Answer like it\'s the real unit test. Every wrong answer shows you <b>why</b> — read it, that\'s how you level up. Questions and answer order reshuffle every time you play.', SECTIONS[sid] ? sid : current);
  const qs = shuffle(bank).slice(0, n);
  let i = 0, score = 0, streak = 0; const misses = [];
  const head = el('div', { class: 'ctrls' }); body.appendChild(head);
  const area = el('div'); body.appendChild(area);
  function hud() { head.innerHTML = `<span class="pill">Question ${Math.min(i + 1, qs.length)} / ${qs.length}</span><span class="pill">Score ${score}</span><span class="pill">🔥 Streak ${streak}</span>`; }
  function show() {
    hud(); area.innerHTML = '';
    if (i >= qs.length) return finish();
    const q = qs[i];
    const d = el('div', { class: 'q' }, `<div class="qt" style="font-size:18px">${q.q}</div>`); area.appendChild(d);
    let answered = false;
    shuffle(q.a.map((t, k) => ({ t, k }))).forEach(o => {
      const b = el('button', { class: 'opt' }, o.t); b.dataset.k = o.k; d.appendChild(b);
      b.onclick = () => {
        if (answered) return; answered = true;
        const ok = o.k === q.c;
        if (ok) { score++; streak++; b.classList.add('right'); } else { streak = 0; b.classList.add('wrong'); misses.push(q); [...d.querySelectorAll('.opt')].forEach(x => { if (+x.dataset.k === q.c) x.classList.add('right'); }); }
        d.appendChild(el('div', { class: 'explain' }, (ok ? '✔ Correct! ' : '✘ ') + (q.e || '')));
        const nx = el('button', { class: 'btn go', style: 'margin-top:10px' }, i + 1 < qs.length ? 'Next question →' : 'See results'); nx.onclick = () => { i++; show(); }; d.appendChild(nx);
        hud();
      };
    });
  }
  function finish() {
    const pct = Math.round(score / qs.length * 100);
    const key = SECTIONS[sid] ? sid : sid;
    const prev = S.best[key]; if (prev == null || pct > prev) { S.best[key] = pct; save(); }
    const grade = pct >= 90 ? '🌋 Legendary' : pct >= 80 ? '🏅 Certified' : pct >= 60 ? '🪨 Getting there' : '🧪 Keep experimenting';
    area.innerHTML = `<div class="readout" style="text-align:center"><div class="big">${pct}%</div><h4>${grade}</h4><p>${score} of ${qs.length} correct. Best: ${S.best[key]}%</p></div>`;
    addXP(score * 10, title);
    if (pct >= 80 && SECTIONS[sid]) complete('exam_' + sid, 80, title);
    if (sid === 'unit' && pct >= 80) complete('exam_unit', 150, 'Unit Test');
    if (misses.length) { const r = el('div', { class: 'check' }, '<h4>📌 Review what you missed</h4>'); misses.forEach(q => r.appendChild(el('div', { class: 'explain', style: 'margin:6px 0' }, `<b>${q.q}</b><br>Answer: <span style="color:#06d6a0">${q.a[q.c]}</span><br>${q.e || ''}`))); area.appendChild(r); }
    const again = el('button', { class: 'btn go', style: 'margin-top:12px' }, '🔁 New random exam'); again.onclick = () => openQuiz(sid, bank, n, title); area.appendChild(again);
  }
  show();
}

/* ================= MATCH GAME ================= */
function openMatch(sid) {
  const s = SECTIONS[sid];
  const body = stageShell('🧩 Specimen Match — ' + s.title, 'Click a <b>term</b>, then click its <b>meaning</b>. Clear the board as fast as you can. Wrong matches add +3 seconds!', sid);
  const pairs = shuffle(s.vocab).slice(0, 8);
  const top = el('div', { class: 'ctrls' }); body.appendChild(top);
  const grid = el('div', { class: 'matchgrid' }); body.appendChild(grid);
  let t0 = performance.now(), penalty = 0, left = pairs.length, sel = null, over = false;

    bR.onclick = () => { view = 'r'; bR.classList.add('on'); bG.classList.remove('on'); sl.style.display = 'none'; if (!sawRidge) { sawRidge = true; discover('Uplift'); toast('🔥 Ridge view logged'); chk(); } };
    const pts = Array.from({ length: 40 }, (_, i) => ({ x: Math.random() * 380, s: i % 2 ? 1 : -1 }));
    function status() { ro.innerHTML = `<h4>📏 Elevation monitor</h4>${view === 'g' ? `Ice: <b>${ice.value}%</b> · Crust height change: <b style="color:${crust < -2 ? '#ef476f' : '#06d6a0'}">${crust.toFixed(0)} m (model units)</b><br>${crust < -20 && +ice.value > 50 ? '⬇ <b>SUBSIDENCE</b>: the glacier\'s weight pushes the crust down.' : sawSub && +ice.value < 20 ? '⬆ <b>REBOUND</b>: the weight is gone, so the crust slowly rises back to its original elevation.' : 'Change the ice thickness.'}` : 'Crust at the ridge is <b>HOT → less dense → high</b> (heating & uplift). As it moves away it <b>COOLS → denser → sinks</b> (cooling & subsidence). Old, cold crust far from the ridge is lower than young, hot crust.'}<br><span class="mono">Subsidence ${sawSub ? '✅' : '⬜'} · Rebound ${sawReb ? '✅' : '⬜'} · Ridge ${sawRidge ? '✅' : '⬜'}</span>`; }
    function chk() { if (sawSub && sawReb && sawRidge && !unlocked) { unlocked = true; checkpoint(body, 'Discovery Check', [
      { q: 'In the glacier experiment, what force caused the crust to subside?', a: ['The weight of the glacier', 'Heat from the mantle', 'Tension', 'Shear stress'], c: 0, e: 'Heavy ice pushes the crust down → subsidence.' },
      { q: 'What is rebound?', a: ['The crust slowly rising back to its original elevation after the weight is removed', 'The glacier growing back', 'A type of fold', 'An earthquake'], c: 0, e: 'Melted glacier → less weight → crust rises.', term: 'Rebound' },
      { q: 'Why does ocean crust far from a mid-ocean ridge subside?', a: ['It cools, becomes denser, and sinks', 'It heats up and rises', 'Glaciers push it down', 'It turns into continental crust'], c: 0, e: 'Hot rock is less dense than cold rock of the same composition.' },
      { q: 'Fault-block mountains show a third cause of subsidence. In a ______, tension stretches the crust and it sinks along normal faults.', a: ['Rift zone at a divergent boundary', 'Subduction zone', 'Ring of Fire', 'Island arc'], c: 0, e: 'A rift zone is a set of deep cracks at a divergent boundary.', term: 'Rift zone' },
      { q: 'Which is TRUE about rocks that subside?', a: ['Unlike some uplifted rocks, they do not deform', 'They always fold', 'They always break', 'They melt'], c: 0, e: 'Uplifted rocks may or may not deform; subsiding rocks do not.' },
    ], done); } }
    loop(dt => {
      T += dt; ctx.clearRect(0, 0, 800, 340);
      if (view === 'g') {
        const target = -(+ice.value) * .8; crust += (target - crust) * dt * .8;
        if (crust < -50) { if (!sawSub) { sawSub = true; discover('Subsidence'); toast('⬇ Subsidence observed!'); } }
        if (sawSub && +ice.value < 15 && crust > -12 && !sawReb) { sawReb = true; discover('Rebound'); toast('⬆ Rebound observed!'); chk(); }
        ctx.fillStyle = '#87c5eb'; ctx.fillRect(0, 0, 800, 340);
        const top = x => 170 - crust * Math.exp(-Math.pow((x - 400) / 220, 2));
        ctx.fillStyle = '#c0703a'; ctx.fillRect(0, 230, 800, 110); txt(ctx, 'MANTLE', 60, 320, { c: '#ffe0cc', size: 13 });
        ctx.beginPath(); for (let x = 0; x <= 800; x += 10) ctx.lineTo(x, top(x)); for (let x = 800; x >= 0; x -= 10) ctx.lineTo(x, top(x) + 75); ctx.closePath(); ctx.fillStyle = '#8a7a5a'; ctx.fill(); txt(ctx, 'CRUST', 700, top(700) + 37, { size: 13 });
        const ih = +ice.value * 1.4; if (ih > 1) { ctx.beginPath(); ctx.moveTo(180, top(180)); for (let x = 180; x <= 620; x += 10) ctx.lineTo(x, top(x) - ih * Math.sin((x - 180) / 440 * Math.PI)); ctx.lineTo(620, top(620)); ctx.closePath(); ctx.fillStyle = '#e3f6ff'; ctx.fill(); ctx.strokeStyle = '#9fd3ff'; ctx.stroke(); txt(ctx, 'GLACIER', 400, top(400) - ih / 2, { c: '#2a6f97' }); if (ih > 40) txt(ctx, '⬇ weight', 400, top(400) - ih / 2 + 22, { c: '#d00', size: 13 }); }
        ctx.setLineDash([6, 6]); ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, 170); ctx.lineTo(800, 170); ctx.stroke(); ctx.setLineDash([]); txt(ctx, 'original elevation', 90, 160, { size: 11, c: '#0b1726' });
      } else {
        ctx.fillStyle = '#1e6fa8'; ctx.fillRect(0, 0, 800, 340); ctx.fillStyle = '#c0703a'; ctx.fillRect(0, 250, 800, 90);
        const top = x => 120 + 90 * Math.min(1, Math.abs(x - 400) / 380) ** .6;
        ctx.beginPath(); for (let x = 0; x <= 800; x += 8) ctx.lineTo(x, top(x)); ctx.lineTo(800, 250); ctx.lineTo(0, 250); ctx.closePath();
        const g = ctx.createLinearGradient(0, 0, 800, 0); g.addColorStop(0, '#2b4f7a'); g.addColorStop(.5, '#d9622b'); g.addColorStop(1, '#2b4f7a'); ctx.fillStyle = g; ctx.fill();
        pts.forEach(p => { p.x += dt * 30; if (p.x > 380) p.x = 0; const x = 400 + p.s * p.x; ctx.beginPath(); ctx.arc(x, top(x) + 15, 4, 0, 7); const h = 1 - p.x / 380; ctx.fillStyle = `rgb(${120 + 135 * h},${120},${255 - 200 * h})`; ctx.fill(); });
        txt(ctx, 'Heating & UPLIFT ⬆', 400, 90, { stroke: '#000' }); txt(ctx, '⬇ Cooling & SUBSIDENCE', 120, 180, { stroke: '#000' }); txt(ctx, 'Cooling & SUBSIDENCE ⬇', 680, 180, { stroke: '#000' }); txt(ctx, 'MID-OCEAN RIDGE', 400, 60, { c: '#ffb703' });
      }
      if (Math.floor(T * 4) !== Math.floor((T - dt) * 4)) status();
    });
  }
});
/* ================= START ================= */
drawHUD(); showSection('7.1');
if (!S.xp) setTimeout(() => toast('👋 Welcome to Terra Lab, scientist! Start with Mission 1. Your progress saves automatically.', 5000), 600);
</script>
